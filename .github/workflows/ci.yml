name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

env:
  ARM_CLIENT_ID: ${{ secrets.CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
  ARM_USE_AZUREAD: "true"

jobs:
  build:
    name: Build and Push to ACR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Placeholder - ACR build steps to be added
        run: echo "ACR build and push steps will go here"

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: build                          # waits for build to succeed first
    defaults:
      run:
        working-directory: terraform-azure-project
    env:
      TF_VAR_resource_group_name: "david-ohanlon-rg"
      TF_VAR_environment: "dev"
      TF_VAR_location: "uksouth"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"

      - name: Terraform Init
        run: terraform init -backend-config="key=dev.terraform.tfstate"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan   # always runs — on every branch

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan   # only on main, uses saved plan